<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shivani!</title>
    <style>
        body {
            margin: 0;
            font-family: 'Pacifico', cursive;
            overflow: hidden;
            color: #fff;
            text-align: center;
            background: linear-gradient(270deg, #f8c8d0, #e0bbf0, #a0d8e0, #f8c8d0);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 3em;
            margin-top: 20vh;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .note {
            font-size: 1.5em;
            margin: 20px 0;
            opacity: 0.8;
        }

        .memories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .memory {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 10px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .memory:hover {
            transform: scale(1.05);
        }

        .carousel {
            margin: 20px 0;
            position: relative;
        }

        .carousel-item {
            display: none;
            font-size: 1.5em;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            margin: 10px auto;
            width: 300px;
        }

        .carousel-item.active {
            display: block;
        }

        .play-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 2em;
            color: #ff6f61;
            margin: 20px;
        }

        .countdown {
            font-size: 2em;
            margin: 20px 0;
        }

        .sparkles {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            color: #ffcc00;
        }

        .floating-heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: url('https://i.imgur.com/1z5g1gD.png') no-repeat center center;
            background-size: contain;
            animation: float 5s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>🎉 Happy Birthday Shivani!</h1>
    <p class="note">You deserve the world, Shivani. This little corner of the internet is just for you.</p>

    <div class="countdown" id="countdown"></div>
    <div class="sparkles" id="sparkles">✨ It’s your day! ✨</div>

    <div class="memories">
        <div class="memory">That time we laughed too hard 💖</div>
        <div class="memory">Cutest moment 💖</div>
        <div class="memory">Best chaos partners 🤪</div>
        <div class="memory">You make life lighter ☀️</div>
        <div class="memory">You’re a safe place 🏡</div>
    </div>
